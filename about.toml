# cargo-about configuration for the third-party notices shipped in release archives.
# See https://embarkstudios.github.io/cargo-about/
#
# Only what actually ends up in the released binary is covered: the notices are generated for
# the release targets below, and dev-dependencies (test-only crates) are not part of them.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The targets release archives are built for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Build-only crates contribute no code to the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
