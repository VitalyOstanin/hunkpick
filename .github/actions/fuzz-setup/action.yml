name: fuzz-setup
description: >-
  Everything a fuzzing job needs before it can run cargo-fuzz: the nightly
  toolchain libFuzzer requires, a cache covering both workspaces, and the
  cargo-fuzz binary. Shared by the per-push build job in ci.yml, which compiles
  every target without running one, and the scheduled search in fuzz.yml, so the
  toolchain and the pins are stated once.

runs:
  using: composite
  steps:
    # rust-toolchain.toml pins the whole repository to stable, and that file wins over an
    # installed toolchain: without this override rustup hands cargo-fuzz the stable rustc,
    # which rejects the `-Z` sanitizer flags libFuzzer needs. Written to the job environment
    # so it also applies to the steps that follow this action.
    - shell: bash
      run: echo "RUSTUP_TOOLCHAIN=nightly" >> "$GITHUB_ENV"
    # libFuzzer needs the sanitizer support only nightly ships (`-Z` flags).
    - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: |
          .
          fuzz
    - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
      with:
        tool: cargo-fuzz@0.13.2
