name: Fuzz

# A search, unlike the smoke run in ci.yml: it runs long enough to reach new code paths and
# keeps the corpus between runs, so each week starts where the last one stopped. Scheduled
# rather than per-push because fuzzing has no natural end and pull requests should not wait
# on it.
on:
  schedule:
    # Sunday and Wednesday, 03:17 UTC — off the hour, where scheduled-run contention is lower.
    # Twice a week rather than once because GitHub evicts a cache entry untouched for 7 days:
    # a weekly cadence sits exactly on that threshold, so one skipped or failed run would drop
    # the corpus and start the next search from nothing.
    - cron: '17 3 * * 0,3'
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to run each target for
        required: false
        default: '15'

permissions:
  contents: read

concurrency:
  # Not `cancel-in-progress`: a manual dispatch would otherwise kill a scheduled search that may
  # be an hour in. The corpus is saved either way (`if: always()` below), but the search itself
  # restarts from the beginning, and the twice-weekly cadence exists so the corpus survives
  # GitHub's 7-day cache eviction. Two searches queueing is the cheaper outcome.
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [parse, roundtrip, selectors]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/fuzz-setup
      # The corpus is the memory of previous runs: without it every run re-discovers the
      # same shallow inputs and never reaches the interesting ones. Restore and save are
      # separate steps on purpose — the combined action skips its save when the job failed,
      # and the job fails exactly when the fuzzer found something, which is the run whose
      # inputs are worth keeping most.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # The target triple is spelled out because cargo-fuzz defaults to the triple it was itself
      # built for, and the prebuilt binary is a static musl build. ASan cannot work against a
      # statically linked libc, so that default fails with
      # "sanitizer is incompatible with statically linked libc".
      - name: Fuzz
        env:
          MINUTES: ${{ github.event.inputs.minutes || '15' }}
          TARGET: ${{ matrix.target }}
        # The value reaches the shell through `env:` rather than template expansion, but that is
        # only half the guard: bash re-expands the contents of a variable inside `$(( ))`, so a
        # dispatch input of `1[$(...)]` would execute the command. Hence the digits-only check
        # before any arithmetic — and it rejects an empty value too, which would silently mean
        # "no time limit".
        run: |
          case "$MINUTES" in
            ''|*[!0-9]*)
              echo "::error::minutes must be a positive integer, got '$MINUTES'"
              exit 1
              ;;
          esac
          if [ "$MINUTES" -lt 1 ]; then
            echo "::error::minutes must be at least 1, got '$MINUTES'"
            exit 1
          fi
          # Upper bound, tied to `timeout-minutes: 90` on the job. A larger budget does not buy
          # a longer search: the job is killed at 90 minutes, and the run then reads as a
          # failure rather than as a finished search. The margin covers the toolchain install,
          # the build and the corpus restore/save around the search itself.
          if [ "$MINUTES" -gt 80 ]; then
            echo "::error::minutes must be at most 80 (the job is killed at 90), got '$MINUTES'"
            exit 1
          fi
          # The corpus directory does not exist on the first run: it is gitignored, so the
          # checkout does not bring it, and the restore step has no cache to restore it from.
          # libFuzzer requires the writable corpus directory to exist and does not create it.
          mkdir -p "fuzz/corpus/$TARGET"
          # Two corpus directories: new inputs are written to the first, and fuzz/seeds/ is
          # read-only starting material committed to the repository — a diff of each shape the
          # parser handles, so a cold run does not spend its budget guessing "diff --git".
          # The dictionary supplies the same tokens as mutation material.
          #
          # A target reads its own seed directory when it has one (selectors: diff, NUL,
          # selector lines) and the shared plain diffs otherwise — parse and roundtrip take the
          # same input, and one set keeps the two from drifting apart.
          SEEDS="fuzz/seeds/$TARGET"
          [ -d "$SEEDS" ] || SEEDS="fuzz/seeds/diff"
          #
          # -timeout=10: parsing an input of the size libFuzzer generates takes milliseconds
          # (the whole 9 MB benchmark diff parses in under a second), so ten seconds is a wide
          # margin over any healthy input and still reports a hang as a crash within the run.
          # The libFuzzer default is 1200 s, long enough to swallow a fifth of a one-hour
          # search before saying anything.
          cargo fuzz run --target x86_64-unknown-linux-gnu "$TARGET" \
            "fuzz/corpus/$TARGET" "$SEEDS" \
            -- "-max_total_time=$((MINUTES * 60))" \
            -dict=fuzz/dictionaries/diff.dict -print_final_stats=1 -timeout=10
      - name: Save the corpus
        # `always()`: see the restore step — a crash is the run worth keeping the corpus from.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      # A crash is the whole point of the run: keep the input that produced it, so it can be
      # replayed locally (drop it into fuzz/artifacts/<target>/ and run scripts/fuzz-repro.sh)
      # and turned into a regression test in tests/.
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          # Longer than the seven days a release archive gets: that one is a hand-off between
          # two jobs of the same run, this one is the only copy of an input a scheduled search
          # found, and the search runs whether or not anybody is looking that week.
          retention-days: 90
