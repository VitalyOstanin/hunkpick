name: Fuzz

# A search, unlike the smoke run in ci.yml: it runs long enough to reach new code paths and
# keeps the corpus between runs, so each week starts where the last one stopped. Scheduled
# rather than per-push because fuzzing has no natural end and pull requests should not wait
# on it.
on:
  schedule:
    # Sunday 03:17 UTC — off the hour, where scheduled-run contention is lower.
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to run each target for
        required: false
        default: '15'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [parse, roundtrip, selectors]
    env:
      # rust-toolchain.toml pins the whole repository to stable, and that file wins over an
      # installed toolchain: without this override rustup hands cargo-fuzz the stable rustc,
      # which rejects the `-Z` sanitizer flags libFuzzer needs.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # libFuzzer needs the sanitizer support only nightly ships (`-Z` flags).
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            fuzz
      # The corpus is the memory of previous runs: without it every week re-discovers the
      # same shallow inputs and never reaches the interesting ones.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-fuzz
      - name: Fuzz
        env:
          MINUTES: ${{ github.event.inputs.minutes || '15' }}
          TARGET: ${{ matrix.target }}
        run: cargo fuzz run "$TARGET" -- -max_total_time=$((MINUTES * 60)) -print_final_stats=1
      # A crash is the whole point of the run: keep the input that produced it, so it can be
      # replayed locally (`cargo fuzz run <target> <artifact>`) and turned into a regression
      # test in tests/.
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
