name: CI

on: [push, pull_request]

# Least privilege for every job: the CI jobs only read the repository. The coverage job
# re-states its scopes because a job-level block resets everything unspecified.
permissions:
  contents: read

# A push to a branch with an open pull request triggers both events; without a group the
# same matrix runs twice. Keep the newest run of each ref and cancel the rest.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # `fuzz` is a workspace of its own (fuzz/Cargo.toml declares `[workspace]`), so neither
      # `--all` above reaches it. Checked on stable even though the targets can only *run* on
      # nightly: libfuzzer-sys compiles here, and holding the lint back until the nightly job
      # would report a formatting slip as a failed sanitizer build.
      - name: Check formatting (fuzz)
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - name: Clippy (fuzz)
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --no-deps
      # A licence gate, not just a document generator: cargo-about fails on any crate whose
      # licence is outside the `accepted` list in about.toml, so a new dependency under an
      # incompatible licence breaks the pull request instead of the release.
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-about
      - name: Third-party licences
        run: bash scripts/generate-notices.sh

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pinned LTS runners, not `ubuntu-latest` (it trails the newest LTS by
        # months). ubuntu-26.04 is the current Ubuntu LTS (preview runner image
        # as of 2026-06); ubuntu-24.04 stays for stable coverage. Drop 24.04 and
        # bump 26.04 when a newer LTS ships. Windows is part of every run, not
        # only of a release: the crate ships an x86_64-pc-windows-msvc binary,
        # and path and line-ending handling differ enough that a regression
        # found at tag time is found too late.
        os: [ubuntu-24.04, ubuntu-26.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Prebuilt nextest binary (no compile, no Rust-version bump): the
      # .config/nextest.toml profile enforces a per-test timeout and bounded
      # parallelism that `cargo test` cannot express.
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-nextest
      - name: Run tests
        run: cargo nextest run --all-features
      # nextest does not run doctests; keep them covered explicitly.
      - name: Run doctests
        run: cargo test --all-features --doc

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # `id-token: write` is required for the Codecov OIDC upload below (no
    # long-lived CODECOV_TOKEN secret). Adding a job-level `permissions:` block
    # resets all unspecified scopes to none, so re-state `contents: read`.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # Line coverage over the same test set nextest runs (the profile in
      # .config/nextest.toml applies here too). Doctests are excluded — they
      # exercise docs, not the coverage-relevant code paths.
      - name: Generate coverage
        run: cargo llvm-cov nextest --all-features --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          # OIDC removes the need for a long-lived CODECOV_TOKEN secret — the
          # action exchanges a short-lived GitHub-issued JWT for an upload
          # credential, which Codecov verifies by repository claim.
          use_oidc: true
          files: ./lcov.info
          flags: unit
          # Don't fail the build on Codecov outages — coverage drift is signal,
          # not a release blocker. The floor is enforced by codecov.yml status.
          fail_ci_if_error: false

  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--locked` as in the release workflow: the MSRV gate must be checked against the
      # dependency versions the project actually ships, not whatever resolves today.
      - name: Build
        run: cargo build --locked

  fuzz:
    name: Fuzz (build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Builds the targets, does not run them: a search needs a corpus and hours, which is what the
    # scheduled run in .github/workflows/fuzz.yml is for. What can regress on a pull request is
    # the targets no longer compiling against the library, and that a build catches.
    #
    # Advisory on purpose: the sanitizer support these targets need exists only on nightly, and
    # the installed nightly is whatever shipped today. A regression in nightly, libfuzzer-sys or
    # cargo-fuzz would otherwise turn every pull request red for a reason outside the change —
    # so the signal stays visible in the run, but does not gate the merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/fuzz-setup
      # The target triple is spelled out because cargo-fuzz defaults to the triple it was itself
      # built for, and the prebuilt binary is a static musl build. ASan cannot work against a
      # statically linked libc, so that default fails with
      # "sanitizer is incompatible with statically linked libc".
      #
      # No target list here: `cargo fuzz build` builds every target the crate declares, so adding
      # one to fuzz/Cargo.toml does not need a matching edit in this file.
      - name: Build every target
        run: cargo fuzz build --target x86_64-unknown-linux-gnu

  # The security audit lives in its own workflow (.github/workflows/audit.yml)
  # so it can also run on a weekly schedule — a cron run catches advisories
  # published against unchanged dependencies, which a push-only audit misses.
